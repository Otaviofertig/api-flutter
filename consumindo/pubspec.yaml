name: consumindo
description: "Libria - Seu Guia Literário. App Flutter consumindo a API pública da Open Library."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Rede
  http: ^1.2.2

  # Injeção de dependência
  get_it: ^8.0.3

  # Persistência local (Minha Estante)
  shared_preferences: ^2.3.3

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
